name: Build applications

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.7'
  CI: 'true'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - name: Test server
        run: python -m unittest discover -s server/tests -v
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: client
      - run: flutter analyze
        working-directory: client
      - name: Test client including local server integration
        run: flutter test --dart-define=ALLOW_INSECURE_LOCALHOST=true --reporter expanded
        working-directory: client

  android:
    name: Android APK and AAB
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build installable debug APK
        run: flutter build apk --debug
      - name: Build unsigned release bundle
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: six-tick-android-debug-apk
          path: client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: six-tick-android-release-unsigned-aab
          path: client/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  apple:
    name: ${{ matrix.platform }} unsigned release
    needs: verify
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build and package iOS
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/artifacts/six-tick-ios-unsigned.zip
      - name: Build and package macOS
        if: matrix.platform == 'macos'
        run: |
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\n' > "$RUNNER_TEMP/unsigned.xcconfig"
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/unsigned.xcconfig" flutter build macos --release
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent 'build/macos/Build/Products/Release/Six Tick.app' build/artifacts/six-tick-macos-unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: six-tick-${{ matrix.platform }}-release-unsigned
          path: client/build/artifacts/six-tick-${{ matrix.platform }}-unsigned.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows release
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - name: Package complete application directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/artifacts | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/artifacts/six-tick-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: six-tick-windows-x64-release
          path: client/build/artifacts/six-tick-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
