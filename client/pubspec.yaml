publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  mobile_scanner: ^7.1.3
  zxing2: ^0.2.4
  image: ^4.5.4
  qr_flutter: ^4.1.0
  desktop_drop: ^0.6.1
  window_manager: ^0.5.1
  uuid: ^4.5.1
  share_plus: ^11.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  qr: ^3.0.2
flutter:
  uses-material-design: true
